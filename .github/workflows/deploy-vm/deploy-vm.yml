name: Deploy VM

on:
  #push:
  #  branches: [main]

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SSH_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build Binary
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -ldflags="-s -w" -o Polybub ./

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Stop the App
        run: |
          ssh $SSH_TARGET "sudo systemctl stop Polybub || true"
          ssh $SSH_TARGET "sudo systemctl reset-failed Polybub || true"

      # Secrets
      - name: Copy Secrets to server
        run: |
          cat > config.json <<'EOF'
          ${{ secrets.CONFIG }}
          EOF
          scp config.json $SSH_TARGET:/var/www/app/Polybub/config.json

      - name: Copy private.pem to server
        run: |
          cat > private.pem <<'EOF'
          ${{ secrets.PRIVATE_PEM }}
          EOF
          scp private.pem $SSH_TARGET:/var/www/app/Polybub/.certs/private.pem

      # TLS
      - name: Copy CERT_PEM to server
        run: |
          cat > tls.pem <<'EOF'
          ${{ secrets.CERT_PEM }}
          EOF
          scp tls.pem $SSH_TARGET:/var/www/app/Polybub/.certs/tls.pem

      - name: Copy CERT_KEY to server
        run: |
          cat > tls.key <<'EOF'
          ${{ secrets.CERT_KEY }}
          EOF
          scp tls.key $SSH_TARGET:/var/www/app/Polybub/.certs/tls.key

      - name: Copy Binary to Remote
        run: |
          scp Polybub $SSH_TARGET:/var/www/app/Polybub/Polybub

      - name: Start App
        run: |
          ssh $SSH_TARGET "sudo systemctl daemon-reload"
          ssh $SSH_TARGET "sudo /usr/bin/systemd-run --unit=polybub \
            --property=User=github_agent \ 
            --property=AmbientCapabilities=CAP_NET_BIND_SERVICE \
            --property=WorkingDirectory=/var/www/app/Polybub \
            /var/www/app/Polybub/Polybub"
