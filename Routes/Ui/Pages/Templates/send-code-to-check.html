<div class="container is-max-tablet">
  <p>Get the code from your third-party authenticator app:</p>
  <form
    hx-put="/api/validate-mfa"
    hx-swap="none"
    hx-headers='js:{
            Code: document.getElementById("code").value,
            Key: document.getElementById("key").innerText 
          }'
  >
    <div class="field">
      <input id="code" class="input" type="text" placeholder="Code" value="" />
    </div>
    <div class="level">
      <button class="button is-primary" type="submit">Submit</button>
      <a class="button is-secondary" href="/dashboard">Cancel</a>
    </div>
  </form>
</div>
